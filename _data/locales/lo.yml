leap_16_coming_soon: |
  ການເປີດຕົວ Leap 16.0 ຢ່າງເປັນທາງການ, ເຊິ່ງເປັນລຸ້ນຕໍ່ຈາກ Leap 15.6, ຄາດວ່າຈະມີຂຶ້ນໃນລະດູໃບໄມ້ຫຼົ່ນ ປີ 2025. ບໍ່ມີແຜນທີ່ຈະສ້າງ Leap 15.7.<br/>
  ກວດເບິ່ງການອັບເດດໄດ້ເປັນປະຈຳທີ່ <a href="https://en.opensuse.org/openSUSE:Roadmap">ແຜນການດຳເນີນງານ</a> ແລະ <a href="https://news.opensuse.org/tag/leap">news.opensuse.org</a> ສຳລັບຂໍ້ມູນເພີ່ມເຕີມ.
