verify_download: ກວດສອບຄວາມຖືກຕ້ອງຂອງໄຟລ໌ກ່ອນໃຊ້ງານ
verify_download_p1: |
  ມີຫຼາຍໂປຣແກຣມທີ່ສາມາດກວດສອບຄ່າ checksum ຂອງໄຟລ໌ທີ່ດາວໂຫຼດມາ. ການກວດສອບ
  ແມ່ນມີຄວາມສຳຄັນຫຼາຍ ເພາະມັນຈະຊ່ວຍຢືນຢັນວ່າທ່ານໄດ້ຮັບໄຟລ໌ ISO ທີ່ຖືກຕ້ອງ
  ແລະ ບໍ່ແມ່ນໄຟລ໌ທີ່ເສຍຫາຍ.
verify_download_p2: |
  ສຳລັບແຕ່ລະ ISO, ພວກເຮົາໄດ້ກຽມໄຟລ໌ checksum ພ້ອມຄ່າ SHA256 ແລະ ໄຟລ໌ລາຍເຊັນດິຈິຕອນໄວ້ໃຫ້.
verify_download_p3: |
  ເພື່ອຄວາມໝັ້ນໃຈໃນຄວາມສົມບູນຂອງໄຟລ໌, ທ່ານສາມາດໃຊ້ sha256sum ເພື່ອກວດສອບຄ່າ checksum ແລະ ໃຊ້ gpgv ເພື່ອກວດສອບລາຍເຊັນດິຈິຕອນ.
verify_download_pubkey: ມັນຄວນຈະເປັນ
verify_download_help: ສຳລັບຄວາມຊ່ວຍເຫຼືອເພີ່ມເຕີມໃນການກວດສອບໄຟລ໌ ກະລຸນາອ່ານ
verify_download_checksums_help: ຄວາມຊ່ວຍເຫຼືອກ່ຽວກັບ Checksums
verify_download_checksums_help_link: 
  https://en.opensuse.org/SDB:Download_help#Checksums
desktops: ມີຫຼາຍເດດທັອບໃຫ້ເລືອກ, ໂດຍມີ 3 ຕົວເລືອກຫຼັກ
desktops_p1: |
  ຂະບວນການຮ່ວມມືຂອງ openSUSE ຊ່ວຍຊຸກຍູ້ການພັດທະນາເດດທັອບສຳລັບທຸກຄົນ,
  ທ່ານຈຶ່ງສາມາດເລືອກຕົວທີ່ມັກໄດ້ໃນລະຫວ່າງການຕິດຕັ້ງ. ພວກເຮົາສະເໜີ 3 
  ສະພາບແວດລ້ອມເດດທັອບຫຼັກ ແລະ ຍັງມີຕົວເລືອກອື່ນໆ ອີກໃນໜ້າການເລືອກຊອບແວ.
installation: ຕິດຕັ້ງໃນແບບທີ່ທ່ານຕ້ອງການ
installation_p1: |
  ຂະບວນການຕິດຕັ້ງ openSUSE ມີທຸກຕົວເລືອກທີ່ທ່ານຕ້ອງການ.
  ຕ້ອງການຕິດຕັ້ງດ້ວຍເມົາສ໌ ແລະ ຄີບອດບໍ? ໃຊ້ຕົວຕິດຕັ້ງແບບກຣາຟິກ.
  ບໍ່ມີເມົາສ໌ບໍ? ໃຊ້ຕົວຕິດຕັ້ງແບບເທີມີນໍ (terminal).
  ບໍ່ສາມາດເຂົ້າເຖິງເຄື່ອງໂດຍກົງບໍ? ເຊື່ອມຕໍ່ເຂົ້າໄປຕິດຕັ້ງແບບໄລຍະໄກ.
  ທຸກຢ່າງມັນງ່າຍດາຍແບບນັ້ນເລີຍ.
points_transparent: ທຸກຢ່າງມີຄວາມໂປ່ງໃສ
points_transparent_p1: |
  ຕັ້ງແຕ່ເລີ່ມຈົນຈົບ, ທຸກໆ ແພັກເກດໃນແຕ່ລະເວີຊັນຈະມີຊອດໂຄ້ດ ແລະ 
  ສະຄຣິບການສ້າງທີ່ເປີດເຜີຍໃຫ້ທຸກຄົນກວດສອບໄດ້. ຫາກສົງໄສໃນແຫຼ່ງທີ່ມາ?
  ພຽງແຕ່ເຂົ້າໄປເບິ່ງໄດ້ທີ່ build service.
points_free: ຊອບແວຟຣີ? ທ່ານເລືອກໄດ້ເອງ
points_free_p1: |
  ແພັກເກດຕ່າງໆ ຈະຖືກແບ່ງອອກເປັນຄັງເກັບແບບຟຣີ ແລະ ບໍ່ຟຣີ.
  ຫາກທ່ານບໍ່ຕ້ອງການໃຊ້ຊອບແວທີ່ບໍ່ຟຣີ? ທ່ານສາມາດປິດຄັງເກັບນັ້ນໄດ້
  ຢ່າງງ່າຍດາຍ. ມັນແມ່ນການຕັດສິນໃຈຂອງທ່ານເອງ.
points_welcoming: ຍິນດີຮັບການຮ່ວມມືຈາກທຸກຄົນ
points_welcoming_p1: |
  ພວກເຮົາພະຍາຍາມຢ່າງເຕັມທີ່ເພື່ອຊຸມຊົນ, ແລະ ພວກເຮົາຈະເຮັດໃຫ້ມັນສຳເລັດໄດ້
  ກໍຕໍ່ເມື່ອຄົນໃນຊຸມຊົນບອກໃນສິ່ງທີ່ເຂົາເຈົ້າຕ້ອງການ. ນັ້ນຄືເຫດຜົນທີ່ພວກເຮົາ
  ເຮັດໃຫ້ການມີສ່ວນຮ່ວມນັ້ນງ່າຍທີ່ສຸດເທົ່າທີ່ຈະເປັນໄປໄດ້.
preconfigured_image: ຮູບແບບທີ່ຕັ້ງຄ່າມາລ່ວງໜ້າ (raw)
preconfigured_image_desc: ຮູບແບບທີ່ຕັ້ງຄ່າມາລ່ວງໜ້າ (raw)
preconfigured_qcow_image: ຮູບແບບທີ່ຕັ້ງຄ່າມາລ່ວງໜ້າ (qcow)
preconfigured_rt_image: ຮູບແບບ RealTime ທີ່ຕັ້ງຄ່າມາລ່ວງໜ້າ (raw)
encrypted_rt_image: ຮູບແບບ RealTime ທີ່ເຂົ້າລະຫັດທັງໝົດ (raw)
selfinstall_image: ຮູບແບບຕິດຕັ້ງເອງອັດຕະໂນມັດ
selfinstall_rt_image: ຮູບແບບ RealTime ຕິດຕັ້ງເອງອັດຕະໂນມັດ
snapper: ລະບົບເສຍຫາຍບໍ? ບໍ່ແມ່ນບັນຫາອີກຕໍ່ໄປ
snapper_p1: |
  ຟີເຈີ Filesystem Snapshots ຈະຊ່ວຍດູແລລະບົບໄຟລ໌ຂອງທ່ານໂດຍການ
  ສຳຮອງຂໍ້ມູນອັດຕະໂນມັດເມື່ອມີການຕິດຕັ້ງຊອບແວ ຫຼື ອັບເດດ.
  ພຽງແຕ່ບູດຈາກ snapshot ກ່ອນໜ້າ, ລະບົບຂອງທ່ານກໍຈະກັບມາໃຊ້ງານໄດ້
  ປົກກະຕິພາຍໃນບໍ່ເທົ່າໃດນາທີ.
software: ການຄົ້ນຫາຊອບແວຈະບໍ່ແມ່ນເລື່ອງຍາກອີກຕໍ່ໄປ
software_p1: |
  ການທີ່ຕ້ອງເຂົ້າເບິ່ງທຸກເວັບໄຊເພື່ອຫາຊອບແວທີ່ຕ້ອງການນັ້ນເປັນເລື່ອງທີ່ເມື່ອຍ.
  ສູນລວມຊອບແວອອນລາຍຈະຊ່ວຍໃຫ້ມັນງ່າຍຂຶ້ນ, ໂດຍການລວມຊອບແວ
  ຈາກຫຼາຍໆ ແຫຼ່ງມາໄວ້ໃນບ່ອນດຽວ.
software_get: ດາວໂຫຼດຊອບແວ
transactional: ເຊີເວີແບບ Transactional
transactional_p1: |
  ຕົວຕິດຕັ້ງໃນປັດຈຸບັນຮອງຮັບລະບົບແບບ Transactional Server,
  ເຊິ່ງເປັນຜົນມາຈາກໂຄງການ openSUSE Kubic. ລະບົບນີ້ມີຈຸດເດັ່ນຄື
  ການອັບເດດແບບ atomic (ເຮັດວຽກຄັ້ງດຽວສຳເລັດທັງໝົດ) ແລະ 
  ສາມາດຍ້ອນກັບ (revert) ໄດ້ງ່າຍຫາກຈຳເປັນ. ຟີເຈີເຫຼົ່ານີ້ພັດທະນາຈາກ
  ເຄື່ອງມືຈັດການແພັກເກດທີ່ SUSE ແລະ openSUSE ໃຊ້ຢູ່ແລ້ວ.
  ນັ້ນໝາຍຄວາມວ່າແພັກເກດ RPM ສ່ວນໃຫຍ່ທີ່ໃຊ້ກັບລະບົບອື່ນໆ ຂອງ 
  openSUSE ກໍສາມາດໃຊ້ກັບ Transactional Server ໄດ້ເຊັ່ນກັນ.
yast: YaST, ຕົວເລືອກທີ່ດີທີ່ສຸດສຳລັບຜູ້ໃຊ້
yast_p1: |
  ໜຶ່ງໃນເຄື່ອງມືຕັ້ງຄ່າລະບົບທີ່ດີທີ່ສຸດ ທີ່ຈະຊ່ວຍໃຫ້ທ່ານຕັ້ງຄ່າທຸກພາກສ່ວນ
  ຂອງລະບົບໄດ້. ທ່ານບໍ່ຈຳເປັນຕ້ອງໄປໄລ່ແກ້ສະຄຣິບ ຫຼື ພິມຄຳສັ່ງທີ່ຊັບຊ້ອນ
  ເພື່ອໃຫ້ໄດ້ລະບົບໃນແບບທີ່ທ່ານຕ້ອງການ.
yast_firewall: ໄຟວໍ (Firewall)
yast_fonts: ຟອນ (Fonts)
yast_hardware: ຮາດແວ
yast_partitioner: ເຄື່ອງມືຈັດການພາທິຊັນ
yast_printer: ເຄື່ອງພິມ
yast_scanner: ເຄື່ອງສະແກນ
yast_sound: ສຽງ
yast_software: ຊອບແວ
zypper: Zypper, ເຄື່ອງມືຈັດການແພັກເກດທີ່ທ່ານຈະປະທັບໃຈ
zypper_p1: |
  ມັນໄວ ແລະ ຮຽນຮູ້ໄດ້ງ່າຍ. ມີ zypper-apt ເພື່ອໃຫ້ໃຊ້ຄຳສັ່ງ apt ແລະ apt-get ໄດ້.
  ພັດທະນາບົນ libsolv ເຊິ່ງຮັບປະກັນທັງຄວາມໄວ ແລະ ການຈັດການຄວາມກ່ຽວພັນ
  ຂອງແພັກເກດ (dependencies) ທີ່ຖືກຕ້ອງ. ໜ້າຕາການໃຊ້ງານຈະແຈ້ງ ແລະ 
  ມີສີສັນທີ່ອ່ານງ່າຍ. ມັນສົມບູນແບບທີ່ສຸດແລ້ວ.
index: openSUSE ເວີຊັນຕ່າງໆ
index_p1: ສຳລັບເດດທັອບ, ເຊີເວີ ແລະ ວຽກງານທຸກຮູບແບບ
index_desktop: ເດດທັອບ (Desktop)
index_desktop_p1: ລວມເວີຊັນຕ່າງໆ ທີ່ເໝາະສຳລັບການໃຊ້ງານທົ່ວໄປ
index_server: ເຊີເວີ (Server)
index_server_p1: ລວມເວີຊັນຕ່າງໆ ທີ່ເໝາະສຳລັບການໃຊ້ງານເປັນເຊີເວີ
index_full: ຫຼື ໄປທີ່ໜ້າດາວໂຫຼດຂອງແຕ່ລະເວີຊັນໂດຍກົງ
desktop: openSUSE ເວີຊັນສຳລັບເດດທັອບ
desktop_p1: |
  ສອງເວີຊັນຫຼັກທີ່ຕອບໂຈດທຸກການໃຊ້ງານ (ມາໃນຮູບແບບສີຂຽວ!)
desktop_tumbleweed_p1: ສຳລັບນັກພັດທະນາ, ຜູ້ຮ່ວມສ້າງ openSUSE, ນັກຫຼິ້ນເກມ ແລະ 
  ຜູ້ທີ່ມັກ Linux/FOSS
desktop_tumbleweed_p2: ເວີຊັນ Rolling release ທີ່ມາພ້ອມແພັກເກດຫຼ້າສຸດຈາກໂຄງການ 
  openSUSE.
desktop_leap_p1: ສຳລັບຜູ້ດູແລລະບົບ, ນັກພັດທະນາລະດັບອົງກອນ ແລະ ຜູ້ໃຊ້ທົ່ວໄປ
desktop_leap_p2: ເວີຊັນປົກກະຕິ ທີ່ລວມເອົາຄວາມໝັ້ນຄົງລະດັບອົງກອນ ແລະ 
  ນະວັດຕະກຳຈາກຊຸມຊົນເຂົ້າກັນ.
server: openSUSE ເວີຊັນສຳລັບເຊີເວີ
server_p1: |
  ສີ່ເວີຊັນທີ່ໝັ້ນຄົງ ແລະ ໄວ້ໃຈໄດ້ ຕາມທີ່ມັນຄວນຈະເປັນ
server_tumbleweed_p1: ສຳລັບນັກພັດທະນາ, ຜູ້ຮ່ວມສ້າງ openSUSE, ນັກຫຼິ້ນເກມ ແລະ 
  ຜູ້ທີ່ມັກ Linux/FOSS
server_tumbleweed_p2: ເວີຊັນ Rolling release ທີ່ມາພ້ອມແພັກເກດຫຼ້າສຸດຈາກໂຄງການ 
  openSUSE.
server_leap_p1: ສຳລັບຜູ້ດູແລລະບົບ, ນັກພັດທະນາລະດັບອົງກອນ ແລະ ຜູ້ໃຊ້ເຊີເວີທົ່ວໄປ
server_leap_p2: ເວີຊັນປົກກະຕິ ທີ່ລວມເອົາຄວາມໝັ້ນຄົງລະດັບອົງກອນ ແລະ 
  ນະວັດຕະກຳຈາກຊຸມຊົນເຂົ້າກັນ.
server_microos_p1: ສຳລັບການໃຊ້ງານເຊີເວີສະເພາະທາງ
server_microos_p2: ອອກແບບມາສຳລັບ Container ພ້ອມລະບົບຈັດການ ແລະ ລົງແພັດ 
  (patching) ອັດຕະໂນມັດ
server_leapmicro_p1: ສຳລັບ Edge, Embedded, IoT ແລະ ການຕິດຕັ້ງໃນຮູບແບບອື່ນໆ
server_leapmicro_p2: ລະບົບປະຕິບັດການທີ່ໝັ້ນຄົງສູງ ແລະ ນ້ຳໜັກເບົາ ອອກແບບມາສຳລັບ 
  Container ແລະ Virtualization.
new_version_available: $distro_name ພ້ອມໃຫ້ດາວໂຫຼດແລ້ວ
new_version_testing: $distro_name ພ້ອມໃຫ້ດາວໂຫຼດ ແລະ ທົດສອບແລ້ວ
view_distro: ເບິ່ງ $distro_name
x86_64: ຄອມພິວເຕີ, ແລັບທັອບ ແລະ ເຊີເວີ Intel ຫຼື AMD 64-ບິດ (x86_64)
i686: ຄອມພິວເຕີ, ແລັບທັອບ ແລະ ເຊີເວີ Intel ຫຼື AMD 32-ບິດ (i686)
aarch64: ເຊີເວີ, ຄອມພິວເຕີ, ແລັບທັອບ ແລະ ບອດ UEFI Arm 64-ບິດ (aarch64)
armv7l: ເຊີເວີ, ຄອມພິວເຕີ, ແລັບທັອບ ແລະ ບອດ UEFI Arm 32-ບິດ (armv7l)
ppc64le: ເຊີເວີ PowerPC, little-endian (ppc64le)
s390x: IBM zSystems ແລະ LinuxONE (s390x)
overview: ພາບລວມ
download: ດາວໂຫຼດ
alternative_downloads: ທາງເລືອກໃນການດາວໂຫຼດອື່ນໆ
alternative_downloads_desc: ພວກເຮົາຍັງມີຮູບແບບ $options ໃຫ້ເລືອກ. 
  ເຂົ້າໄປເບິ່ງໄດ້ທີ່ $alternative_downloads!
MicroOS_features:
  idea:
    name: ແນວຄິດຫຼັກ
    description: |
      ### ຄາດການໄດ້
      * ລະບົບຈະບໍ່ຖືກປ່ຽນແປງໃນລະຫວ່າງການເຮັດວຽກ
      * ຈະເຮັດວຽກຄືເກົ່າຢ່າງສະໝ່ຳສະເໝີໃນທຸກໆ ການບູດ

      ### ຂະຫຍາຍຕົວໄດ້ງ່າຍ
      * ຫຼຸດຜ່ອນການຕັ້ງຄ່າແຍກແຕ່ລະເຄື່ອງໃນລະຫວ່າງໃຊ້ງານ
      * ສາມາດຕິດຕັ້ງຊ້ຳໄດ້ງ່າຍ ແລະ ໄດ້ຜົນລັດທີ່ແນ່ນອນ

      ### ໄວ້ໃຈໄດ້
      * ມີລະບົບກູ້ຄືນອັດຕະໂນມັດຫາກການອັບເດດມີບັນຫາ
  update:
    name: ການອັບເດດແບບ Atomic
    description: |
      ### ການອັບເດດແບບ Transactional

      #### ໂດດເດັ່ນ
      MicroOS ໃຊ້ btrfs ພ້ອມກັບ snapshots ເພື່ອປະຢັດພື້ນທີ່
      ໃນການຈັດເກັບປະຫວັດຂອງລະບົບໄຟລ໌. ທຸກໆ ໄຟລ໌ຕັ້ງຄ່າ
      ໃນ `/etc` ຈະຖືກລວມເຂົ້າໃນ snapshot ແລະ ສາມາດ rollback ໄດ້.

      #### ຢືດຢຸ່ນ
      * ບໍ່ຕ້ອງໃຊ້ຮູບແບບແພັກເກດໃໝ່, ສາມາດໃຊ້ openSUSE RPM ມາດຕະຖານໄດ້
      * ບໍ່ມີຂໍ້ຈຳກັດດ້ານຂະໜາດ ທັງພາທິຊັນ ແລະ ລະບົບປະຕິບັດການ
      * ພັດທະນາຕໍ່ຍອດໄດ້ງ່າຍ
  shield:
    name: ການຍ້ອນກັບ (Rollback)
    description: |
      ### MicroOS ແມ່ນລະບົບທີ່ບໍ່ມີການປ່ຽນແປງ (Immutable OS), ການຍ້ອນກັບຈຶ່ງງ່າຍດາຍ
      * Immutable: ບໍ່ມີການປ່ຽນແປງຂໍ້ມູນໃນດິດ
      * Rollback ງ່າຍໆ ພຽງແຕ່ບູດໄປຫາ snapshot ຂອງ BTRFS ອັນເກົ່າ
  key:
    name: ການອັບເດດທີ່ປອດໄພ
    description: |
      * ອັບເດດຜ່ານ HTTPS
      * ແພັກເກດ ແລະ ຄັງເກັບໄດ້ຮັບການເຊັນຢືນຢັນຈາກລະບົບຂອງພວກເຮົາ
      * ແພັກເກດທຸກອັນຖືກກວດສອບຄວາມຖືກຕ້ອງ
      * ຈະບໍ່ມີການອັບເດດຫາກພົບວ່າແພັກເກດມີຄວາມຂັດແຍ້ງກັນ
      * ບໍ່ເປືອງພື້ນທີ່: snapshot ຈະຖືກລົບຖິ້ມຫາກການອັບເດດບໍ່ສຳເລັດ
  work:
    name: ການຈັດການວຽກ (Workloads)
    description: |
      ແອັບພລິເຄຊັນຈະຖືກຕິດຕັ້ງໃນ container ແທນທີ່ຈະຕິດຕັ້ງໃນລະບົບໄຟລ໌ຫຼັກ:
      * ແຍກອອກຈາກລະບົບໄຟລ໌ຫຼັກຢ່າງຊັດເຈນ
      * ຫຼຸດຄວາມສ່ຽງຈາກແອັບພລິເຄຊັນທີ່ເປັນອັນຕະລາຍ
      * ຕິດຕັ້ງໃໝ່ໄດ້ໂດຍບໍ່ຕ້ອງບູດເຄື່ອງ
      * ອັບເດດແບບ atomic (ສ້າງອັນໃໝ່, ປິດອັນເກົ່າ)
      * Rollback ໄດ້ງ່າຍ
  tool:
    name: ການແກ້ໄຂຈຸດບົກພ່ອງ (Debugging)
    description: |
      ### Debugging Toolbox Container
      * ເປີດໃຊ້ງານ container ທີ່ມີສິດສູງສຸດ
      * ສາມາດເຂົ້າເຖິງ root filesystem ໄດ້ທີ່ `/media/root`
      * ໃຊ້ zypper ຕິດຕັ້ງເຄື່ອງມືທີ່ຈຳເປັນໄດ້ທັນທີໂດຍບໍ່ຕ້ອງບູດເຄື່ອງ
      * ຂໍ້ມູນຈະຄົງຢູ່ຕະຫຼອດການໃຊ້ງານ
Tumbleweed_features:
  update:
    name: ອັບເດດຢ່າງຕໍ່ເນື່ອງ
    description: |
      ຕິດຕັ້ງຄັ້ງດຽວ ແລະ ໃຊ້ໄດ້ຕະຫຼອດໄປ. ທ່ານບໍ່ຕ້ອງກັງວົນກ່ຽວກັບການອັບເກຣດລະບົບຄັ້ງໃຫຍ່ທຸກໆ 6 ເດືອນ ທີ່ອາດຈະເຮັດໃຫ້ລະບົບມີບັນຫາ.
  knife:
    name: ທັນສະໄໝທີ່ສຸດ
    description: |
      ທ່ານຈະໄດ້ຮັບການອັບເດດເປັນປະຈຳ ເຊິ່ງບໍ່ພຽງແຕ່ແກ້ໄຂຊ່ອງໂຫວ່ ຫຼື ບັກເທົ່ານັ້ນ, ແຕ່ຍັງລວມເຖິງຟີເຈີໃໝ່ໆ, ເຄີເນິລ (kernel) ໃໝ່, ໄດເວີໃໝ່ ແລະ ເດດທັອບເວີຊັນຫຼ້າສຸດ.
  home:
    name: ໝັ້ນຄົງ
    description: |
      ການອັບເດດທຸກຄັ້ງໄດ້ຮັບການທົດສອບຕາມມາດຕະຖານຄຸນນະພາບລະດັບອຸດສາຫະກຳ ໂດຍໃຊ້ build service ທີ່ໂດດເດັ່ນ. ບໍ່ພຽງແຕ່ທົດສອບແຕ່ລະແພັກເກດແຍກກັນ, ແຕ່ຍັງທົດສອບການເຮັດວຽກຮ່ວມກັນຂອງທຸກແພັກເກດ ເພື່ອໃຫ້ໝັ້ນໃຈວ່າລະບົບຂອງທ່ານຈະເຮັດວຽກໄດ້ຢ່າງສະໝ່ຳສະເໝີ.
  user:
    name: ໃຊ້ງານງ່າຍ
    description: |
      ດ້ວຍຄຳສັ່ງພຽງອັນດຽວ, ທ່ານສາມາດອັບເດດແພັກເກດນັບພັນ, ຍ້ອນກັບໄປໃຊ້ snapshot ຂອງອາທິດກ່ອນ, ຫຼື ແມ່ນແຕ່ເບິ່ງຕົວຢ່າງເວີຊັນທີ່ກຳລັງຈະມາເຖິງ.
  cpu:
    name: ເຂົ້າກັບຮາດແວຂອງທ່ານໄດ້ເປັນຢ່າງດີ
    description: |
      ດ້ວຍຄວາມທັນສະໄໝ ແລະ ການທົດສອບທີ່ດີ, Tumbleweed ຮອງຮັບຮາດແວ ແລະ ອຸປະກອນຕ່າງໆ ໄດ້ດີກວ່າ Linux ເວີຊັນອື່ນໆ, ເໝາະສຳລັບທັງ Workstation, ແລັບທັອບ ແລະ ໂນດບຸກ.
  key:
    name: ປອດໄພ
    description: |
      ຫາກເກີດບັນຫາທີ່ບໍ່ຄາດຄິດ, ທ່ານສາມາດ rollback ກັບໄປສະພາວະກ່ອນໜ້າໄດ້ສະເໝີ ໂດຍທີ່ໄຟລ໌ ແລະ ໂປຣແກຣມຂອງທ່ານຈະຍັງຄືເກົ່າກ່ອນທີ່ຈະມີການອັບເດດ.
  shield:
    name: ລະບົບຄວາມປອດໄພສູງ
    description: |
      ສ້າງຈາກເຄີເນິລຫຼ້າສຸດ, ພ້ອມແພັດປ້ອງກັນ Spectre / Meltdown, ແລະ ມີການເປີດໃຊ້ໄຟວໍ ພ້ອມນະໂຍບາຍຄວາມປອດໄພທີ່ເຂັ້ມງວດມາໃຫ້ຕັ້ງແຕ່ເລີ່ມຕົ້ນ.
  power:
    name: ຊົງພະລັງ
    description: |
      ດ້ວຍເຕັກໂນໂລຊີທີ່ໂດດເດັ່ນຂອງ openSUSE ເຊັ່ນ ລະບົບໄຟລ໌ `Btrfs`, ເຄື່ອງມື `snapper` ແລະ ແຜງຄວບຄຸມ `YaST` ທີ່ໄວ້ໃຈໄດ້, Tumbleweed ຊ່ວຍໃຫ້ທ່ານຄວບຄຸມລະບົບໄດ້ຢ່າງເຕັມທີ່ ແລະ ຕັ້ງຄ່າທຸກຢ່າງໄດ້ຕາມຕ້ອງການ ໂດຍບໍ່ຕ້ອງກັງວົນວ່າລະບົບຈະມາກວນການເຮັດວຽກຂອງທ່ານ.
  plant:
    name: ພື້ນຖານທີ່ແຂງແກ່ນ
    description: |
      Tumbleweed ພັດທະນາຈາກປະສົບການການໃຊ້ງານ ແລະ ການທົດສອບມາຫຼາຍສິບປີ ໂດຍນັກພັດທະນາ ແລະ ຜູ້ດູແລລະບົບມືອາຊີບ. ຄວາມແຂງແກ່ນຂອງ Tumbleweed ມາຈາກແພັກເກດຫຼັກທີ່ມີພື້ນຖານດຽວກັນກັບ SUSE Linux Enterprise Server.
  gamepad:
    name: ການຫຼິ້ນເກມ
    description: |
      Tumbleweed ໃຫ້ບໍລິການຊອບແວທີ່ກ່ຽວກັບການຫຼິ້ນເກມເວີຊັນຫຼ້າສຸດ. ດ້ວຍການພັດທະນາຂອງ Linux ທີ່ຮອງຮັບການຫຼິ້ນເກມໄດ້ດີຂຶ້ນເລື້ອຍໆ, ທ່ານຈະໄດ້ຮັບປະສົບການທີ່ລື່ນໄຫຼ ແລະ ມີປະສິດທິພາບໃນເກມທີ່ທ່ານມັກ.
leap_ovw_title: ວິທີໃໝ່ໃນການສ້າງ openSUSE ທີ່ມາພ້ອມໄລຍະເວລາການຊັບພອດທີ່ດົນກວ່າ
leap_ovw_desc: Leap 16.0 ໃຊ້ແນວທາງແບບໄຮບຣິດ ໂດຍລວມເອົາຊອດໂຄ້ດຈາກ SUSE Linux 
  Enterprise (SLE) ເຂົ້າກັບການພັດທະນາຈາກຊຸມຊົນ, ເຮັດໃຫ້ມີຄວາມໝັ້ນຄົງສູງ. ດ້ວຍ 
  <strong>ໄລຍະເວລາການຊັບພອດທີ່ຍາວເຖິງ 24 ເດືອນ</strong>, Leap 
  ຈຶ່ງເປັນທາງເລືອກທີ່ດີທີ່ສຸດສຳລັບຜູ້ໃຊ້, ນັກພັດທະນາ ແລະ ຜູ້ດູແລລະບົບ.
tumbleweed_ovw_title: ລະບົບປະຕິບັດການສຳລັບເດດທັອບ ແລະ ເຊີເວີ ທີ່ທັນສະໄໝທີ່ສຸດ
tumbleweed_ovw_desc: ດ້ວຍ Tumbleweed, ທ່ານບໍ່ຕ້ອງເລືອກລະຫວ່າງສິ່ງທີ່ທ່ານຕ້ອງການ,
  ບໍ່ວ່າຈະເປັນອິດສະຫຼະພາບ ຫຼື ຄວາມປອດໄພ, ການຄວບຄຸມ ຫຼື ຄວາມໝັ້ນຄົງ, ເຕັກໂນໂລຊີ 
  ຫຼື ສະຖຽນລະພາບ -- ເພາະ Tumbleweed ໃຫ້ທ່ານໄດ້ທຸກຢ່າງໃນບ່ອນດຽວ!
leap_micro_ovw_title: Leap Micro ແມ່ນລະບົບປະຕິບັດການທີ່ໝັ້ນຄົງສູງ ແລະ ນ້ຳໜັກເບົາ
  ອອກແບບມາສຳລັບ Container ແລະ Virtualization.
leap_micro_ovw_desc_p1: ເວີຊັນຊຸມຊົນນີ້ພັດທະນາຈາກ SUSE Linux Micro, 
  ເຊິ່ງໃຊ້ເຕັກໂນໂລຊີຄວາມປອດໄພລະດັບອົງກອນຈາກ SUSE Linux Enterprise. 
  ການລວມຕົວຂອງເຕັກໂນໂລຊີເຫຼົ່ານີ້ເຮັດໃຫ້ໄດ້ແພລັດຟອມທີ່ທັນສະໄໝ, ບໍ່ມີການປ່ຽນແປງ 
  (immutable) ແລະ ເປັນມິດກັບນັກພັດທະນາ.
leap_micro_ovw_desc_p2: Leap Micro ຕັ້ງແຕ່ເວີຊັນ 6.0 ມີໃຫ້ເລືອກທັງແບບ 
  self-install, raw image ແລະ Packages DVD ທີ່ໃຊ້ເປັນຄັງເກັບແບບອອບລາຍໄດ້. 
  ພວກເຮົາແນະນຳໃຫ້ໃຊ້ Self-install image ສຳລັບການຕິດຕັ້ງຜ່ານ USB. 
  ຜູ້ໃຊ້ສາມາດຕັ້ງຄ່າອັດຕະໂນມັດໄດ້ດ້ວຍ <a 
  href="https://en.opensuse.org/Portal:MicroOS/Ignition">Ignition</a> ຫຼື <a 
  href="https://github.com/openSUSE/combustion">Combustion</a> ຫຼື ໃຊ້ 
  jeos-firstboot. ສາມາດທົດລອງໃຊ້ <a 
  href="https://opensuse.github.io/fuel-ignition/">Fuel Ignition</a> 
  ເພື່ອສ້າງໄຟລ໌ຕັ້ງຄ່າອອນລາຍໄດ້.
leap_micro_ovw_desc_p3: ທົດລອງໃຊ້ Leap Micro ໃນ VM ເທິງ <a 
  href="https://www.suse.com/c/happened-kernel-xen/">Xen</a> ຫຼື KVM. ສຳລັບ 
  Raspberry Pi ຫຼື ບອດ SoC ອື່ນໆ ສາມາດໃຊ້ຮູບແບບທີ່ຕັ້ງຄ່າມາລ່ວງໜ້າໄດ້. ທັງຮູບແບບ
  preconfigured ແລະ self-installed ແມ່ນອອກແບບມາໃຫ້ໃຊ້ຮ່ວມກັບ <a 
  href="https://en.opensuse.org/Portal:MicroOS/Combustion">Combustion</a> ຜ່ານ 
  USB ເພື່ອຕັ້ງຄ່າລະບົບໃນການບູດຄັ້ງທຳອິດ.
leap_micro_ovw_video_desc: ຕົວຢ່າງການຕິດຕັ້ງ Leap Micro 6.1 
  ພ້ອມການເຂົ້າລະຫັດດິດທັງໝົດ ແລະ ການຢືນຢັນຕົວຕົນສອງຊັ້ນໃນ cockpit.
leap_156_ovw_video_desc: ວິດີໂອໄລຟ໌ສົດການເປີດຕົວ Leap 15.6
leap_160_ovw_video_desc: ວິດີໂອໄລຟ໌ສົດການເປີດຕົວ Leap 16.0
microos_ovw_title: Micro Service OS ທີ່ຮອງຮັບການອັບເດດແບບ Transactional (Atomic)
  ເທິງລະບົບໄຟລ໌ btrfs ແບບອ່ານຢ່າງດຽວ
microos_ovw_desc_p1: ອອກແບບມາສຳລັບ Container ພ້ອມລະບົບຈັດການ ແລະ 
  ລົງແພັດອັດຕະໂນມັດ. ການຕິດຕັ້ງ openSUSE MicroOS 
  ຈະຊ່ວຍໃຫ້ທ່ານໄດ້ສະພາບແວດລ້ອມທີ່ນ້ອຍ ແລະ ວ່ອງໄວສຳລັບ Container ຫຼື 
  ວຽກງານທີ່ຕ້ອງການການອັບເດດແບບ Transactional. ໃນຖານະທີ່ເປັນ Rolling release, 
  ຊອບແວຈະທັນສະໄໝຢູ່ສະເໝີ.
microos_ovw_desc_p2: MicroOS ມີຮູບແບບອອບລາຍໃຫ້ເລືອກ. 
  ຄວາມແຕກຕ່າງຫຼັກຄືຮູບແບບອອບລາຍຈະມີຕົວຕິດຕັ້ງມາໃຫ້. ສ່ວນແບບ Raw ແລະ Self-install
  ຈະເນັ້ນການຕັ້ງຄ່າຜ່ານ combustion ຫຼື ຕັ້ງຄ່າດ້ວຍຕົນເອງຫຼັງຈາກຂຽນລົງດິດແລ້ວ. 
  ນອກຈາກນີ້ຍັງມີຕົວເລືອກ real-time kernel ອີກດ້ວຍ.
microos_ovw_desc_p3: ທົດລອງໃຊ້ MicroOS ໃນ VM ທີ່ເຮັດວຽກຢູ່ເທິງ <a 
  href="https://www.suse.com/c/happened-kernel-xen/">Xen</a> ຫຼື KVM. ການໃຊ້ 
  Raspberry Pi ຫຼື ຮາດແວ System on Chip ອື່ນໆ ອາດໃຊ້ ອິເມຈທີ່ກຳນົດຄ່າມາລ່ວງໜ້າ 
  ຮ່ວມກັບຟັງຊັນ <a 
  href="https://en.opensuse.org/Portal:MicroOS/Combustion">Combustion</a> 
  ສຳລັບຂະບວນການບູດ. ທັງອິເມຈທີ່ກຳນົດຄ່າມາລ່ວງໜ້າ ແລະ ອິເມຈທີ່ຕິດຕັ້ງດ້ວຍຕົນເອງ 
  ແມ່ນມີຈຸດປະສົງເພື່ອໃຊ້ຮ່ວມກັບ <a 
  href="https://en.opensuse.org/Portal:MicroOS/Combustion">Combustion</a> 
  ທີ່ຂຽນລົງໃນ USB, ເຊິ່ງຈະຊ່ວຍໃຫ້ສາມາດຕັ້ງຄ່າໃນການບູດເຄື່ອງຄັ້ງທຳອິດ, 
  ພ້ອມກັບຕົວເລືອກໃນການປ່ຽນແປງທີ່ປ້ອງກັນດ້ວຍລະຫັດຜ່ານເລີ່ມຕົ້ນ.
