leap_switch_p1: |
  ຖ້າທ່ານກຳລັງໃຊ້ openSUSE ຢູ່ແລ້ວ, ທ່ານສາມາດອັບເກຣດໄດ້ໂດຍການບູດຈາກ
  DVD/USB ແລ້ວເລືອກ upgrade, ຫຼື ໃຊ້ວິທີ ‘Online Upgrade’ 
  ດ້ວຍຄຳສັ່ງພຽງບໍ່ເທົ່າໃດ.
leap_switch_instructions: ຄຳແນະນຳການອັບເກຣດອອນລາຍ.
leap_switch_instructions_link: https://en.opensuse.org/SDB:System_upgrade
