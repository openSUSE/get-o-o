requirements_mem_desc: RAM $value + ໜ່ວຍຄວາມຈຳເພີ່ມເຕີມສຳລັບວຽກຂອງທ່ານ
requirements_hdd: ພື້ນທີ່ຈັດເກັບຂໍ້ມູນ
requirements_hdd_desc: ພື້ນທີ່ວ່າງໃນຮາດດິດຫຼາຍກວ່າ 40GB
requirements_hdd_root: ພາທິຊັນ / (root)
requirements_hdd_var: ພາທິຊັນ /var
requirements_hdd_size_desc: ພື້ນທີ່ດິດທີ່ໃຊ້ໄດ້ $value
requirements_hdd_swap_info: ຕ້ອງປິດ swap space ເພື່ອໃຫ້ kubernetes 
  ເຮັດວຽກໄດ້ຢ່າງຖືກຕ້ອງ
requirements_hdd_ssd_info: SSD ທີ່ມີຄວາມໄວໃນການຂຽນສູງ
requirements_dvd_desc: ໄດຣຟ໌ DVD ຫຼື ພອດ USB ສຳລັບສື່ຕິດຕັ້ງ
requirements_net: ເຄືອຂ່າຍ
requirements_net_desc: ການເຂົ້າເຖິງອິນເຕີເນັດມີປະໂຫຍດ ແລະ ຈຳເປັນສຳລັບ Network 
  Installer
requirements_net_conn: ການເຊື່ອມຕໍ່ເຕັມຮູບແບບລະຫວ່າງເຄື່ອງທັງໝົດໃນຄລັດສະເຕີ 
  (cluster)
requirements_net_mac: ຊື່ໂຮສ (hostname) ແລະ ໝາຍເລກ MAC ທີ່ບໍ່ຊ້ຳກັນສຳລັບທຸກໆ ໂນດ
  (node)
