live_info: |
  ກະລຸນາຮັບຊາບກ່ຽວກັບຂໍ້ຈຳກັດຂອງຮູບແບບ Live ດັ່ງນີ້:
  * ບໍ່ຄວນໃຊ້ເພື່ອຕິດຕັ້ງ ຫຼື ອັບເກຣດ. ກະລຸນາໃຊ້ສື່ສຳລັບຕິດຕັ້ງໂດຍສະເພາະແທນ
  * ມີແພັກເກດ ແລະ ໄດເວີທີ່ຈຳກັດ, ຈຶ່ງອາດຈະບໍ່ສາມາດທົດສອບໄດ້ຢ່າງເຕັມທີ່ວ່າຈະໃຊ້ກັບຮາດແວຂອງທ່ານໄດ້ຫຼືບໍ່
  * ບໍ່ສາມາດອັບເດດ Kernel ແລະ initrd ໄດ້, ຈຶ່ງບໍ່ຄວນໃຊ້ເປັນການຕິດຕັ້ງແບບຖາວອນ
microos_desc: ລະບົບປະຕິບັດການທີ່ພັດທະນາຈາກ openSUSE Tumbleweed 
  ທີ່ຮອງຮັບການອັບເດດແບບ Transactional (Atomic) ເທິງລະບົບໄຟລ໌ btrfs 
  ແບບອ່ານຢ່າງດຽວ
choosing_media: ການເລືອກສື່ທີ່ຈະດາວໂຫຼດ
choosing_media_p1: |
  ແນະນຳໃຫ້ໃຊ້ຮູບແບບ Offline Image ເພາະລວມມີແພັກເກດສ່ວນໃຫຍ່
  ທີ່ມີໃນເວີຊັນນັ້ນ ແລະ ບໍ່ຈຳເປັນຕ້ອງເຊື່ອມຕໍ່ອິນເຕີເນັດ
  ໃນລະຫວ່າງການຕິດຕັ້ງ.
choosing_media_agama_p1: |
  <a href="https://github.com/agama-project/agama">Agama</a> ແມ່ນຕົວຕິດຕັ້ງໃໝ່ທີ່ສາມາດໃຊ້ຕິດຕັ້ງ Leap 16 ແລະ Tumbleweed.
  ມີແຜນທີ່ຈະຮອງຮັບການຕິດຕັ້ງແບບອອບລາຍໃນ Agama. ສື່ຕິດຕັ້ງອື່ນໆ ເຊັ່ນ ຮູບແບບຕິດຕັ້ງເອງອັດຕະໂນມັດ ຈະຖືກເພີ່ມເຂົ້າມາພາຍຫຼັງ.
choosing_media_micro_p1: |
  ຮູບແບບຕິດຕັ້ງເອງອັດຕະໂນມັດໃໝ່ ແມ່ນຕົວເລືອກຫຼັກສຳລັບການຕິດຕັ້ງຜ່ານ USB ຫຼື DVD.
  ຕົວຊ່ວຍຕິດຕັ້ງຈະນຳເອົາຮູບແບບທີ່ຕັ້ງຄ່າມາລ່ວງໜ້າລົງໃນໄດຣຟ໌ ແລະ ຂະຫຍາຍພື້ນທີ່ພາທິຊັນໃຫ້ເຕັມຂະໜາດຂອງດິດ.
  <br>
  ຜູ້ໃຊ້ Raspberry Pi ຫຼື ອຸປະກອນທີ່ບໍ່ຮອງຮັບ usb-boot ສາມາດຂຽນຮູບແບບທີ່ຕັ້ງຄ່າມາລ່ວງໜ້າລົງໃນ SD card ໄດ້ໂດຍກົງ.
  ຜູ້ໃຊ້ທີ່ຕ້ອງການຄວບຄຸມການຕິດຕັ້ງຫຼາຍຂຶ້ນ ແນະນຳໃຫ້ໃຊ້ <a href="https://en.opensuse.org/Portal:MicroOS/Combustion">Combustion</a>.
  <br>
  ສາມາດເບິ່ງຕົວຢ່າງການຕິດຕັ້ງດ້ວຍ combustion ໄດ້ <a href="https://www.youtube.com/watch?v=ANh5FHZDOxo">ທີ່ນີ້</a>.
  <br>
  jeos-firstboot ຈະສະແດງຂຶ້ນສຳລັບຜູ້ທີ່ບໍ່ໄດ້ຕັ້ງຄ່າລະບົບດ້ວຍ Combustion.
choosing_media_p2: |
  ແນະນຳ Network Image ສຳລັບຜູ້ທີ່ມີຄວາມໄວອິນເຕີເນັດຈຳກັດ
  ເພາະມັນຈະດາວໂຫຼດສະເພາະແພັກເກດທີ່ທ່ານເລືອກຕິດຕັ້ງ,
  ເຊິ່ງມັກຈະມີຂະໜາດໜ້ອຍກວ່າ 4.7GB ຫຼາຍ.
choosing_media_micro_p2: |
  Leap Micro ບໍ່ມີຕົວຕິດຕັ້ງແບບເກົ່າອີກຕໍ່ໄປ, ຜູ້ໃຊ້ຄວນໃຊ້ສື່ຕິດຕັ້ງແບບ Self-install ແທນ.
  Packages Image ໃໝ່ ແມ່ນພຽງແຕ່ຄັງເກັບແພັກເກດ rpm ຂອງ Leap Micro ແບບອອບລາຍ ສຳລັບຜູ້ທີ່ຢູ່ໃນສະພາບແວດລ້ອມທີ່ບໍ່ມີອິນເຕີເນັດ.
