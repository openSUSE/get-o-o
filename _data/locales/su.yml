immutable_images_info: Leap Immutable nyaéta varian Leap anu sistem file root-na
  ngan bisa dibaca (read-only) sarta diapdet sacara transaksional, ngagantikeun 
  Leap Micro mimiti ti Leap 16.1. Citra pasang-mandiri téh anu ku urang 
  disarankeun pikeun pamasangan maké USB. Atur sistemna dina boot munggaran maké
  <a href="https://en.opensuse.org/Portal:MicroOS/Ignition">Ignition</a> atawa 
  <a href="https://en.opensuse.org/Portal:MicroOS/Combustion">Combustion</a>.
